name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  check-release:
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version & check existing release
        id: get-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Checking for existing tag: $VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists. Skipping build."
            exit 1
          fi

          echo "✅ No existing release found for $VERSION. Proceeding."

  build-and-release:
    needs: check-release
    if: startsWith(github.event.head_commit.message, 'release:')
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check-release.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm version
        shell: pwsh
        run: 'Write-Host "Release version: $env:VERSION"'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git tar unzip curl

      - name: Setup env (MSYS2)
        shell: msys2 {0}
        working-directory: scripts/build
        run: bash 1-setup-env.sh

      - name: Build FFmpeg (MSYS2)
        shell: msys2 {0}
        working-directory: scripts/build
        run: bash 2-build-ff.sh

      - name: Build mpv (MSYS2)
        shell: msys2 {0}
        working-directory: scripts/build
        run: bash 3-build-mpv.sh

      - name: Harvest binaries (MSYS2)
        shell: msys2 {0}
        working-directory: scripts/build
        run: bash 4-harvest-all.sh

      - name: Record build configs + collect MSYS2 licenses (MSYS2)
        shell: msys2 {0}
        working-directory: scripts/build
        run: |
          bash ../record-legal.sh
          cd ../..
          bash scripts/generate-msys2.sh

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend license tools
        shell: pwsh
        run: bun add -d license-checker-rseidelsohn

      - name: Install Rust license tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-license,cargo-about,cargo-deny

      - name: Fetch crate sources (required by cargo-about)
        shell: pwsh
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Generate license report (PowerShell)
        shell: pwsh
        run: bun scripts/generate-legal.ts

      - name: Build Tauri app (PowerShell)
        shell: pwsh
        run: bun run tauri build

      - name: Package release ZIP (PowerShell)
        shell: pwsh
        run: |
          .\scripts\package-release.ps1 -Version "${{ env.VERSION }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: |
            windows-x64.zip
          body: |
            ## Download

            `windows-x64.zip` contains the
            executable, all bundled libraries, and legal notices. Extract and run
            `tauri-video-cut.exe`.

            ## GPL Compliance & Source Code

            This release contains GPL-2.0 licensed binaries.

            In accordance with GPLv2 Section 3, Paragraph 5, the complete
            corresponding source code is available from this same designated
            place (this repository).

            - **Build Scripts**: Preserved in [`scripts/build/`](./tree/${{ github.sha }}/scripts/build) at commit `${{ github.sha }}`.
            - **FFmpeg Source**: [n9.0.1](https://github.com/FFmpeg/FFmpeg/tree/n9.0.1)
            - **mpv Source**: [v0.41.0](https://github.com/mpv-player/mpv/tree/v0.41.0)
            - **libmpv-wrapper**: [v0.1.1](https://github.com/nini22P/libmpv-wrapper/tree/v0.1.1)

            See [`SOURCE-OFFER.md`](./blob/${{ github.sha }}/SOURCE-OFFER.md) for full details.

            > Note: bundled FFmpeg requires an AVX2-capable CPU (x86-64-v3).
