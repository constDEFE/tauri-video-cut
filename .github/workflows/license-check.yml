name: license-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend license tools
        run: bun add -d license-checker-rseidelsohn

      - name: Install Rust license tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-license,cargo-about,cargo-deny

      - name: Fetch crate sources (required by cargo-about)
        run: cargo fetch --manifest-path src-tauri/Cargo.toml

      - name: Generate license reports
        run: bun scripts/generate-legal.ts

      - name: Check Rust license policy
        run: cargo deny --manifest-path src-tauri/Cargo.toml check licenses

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: legal-artifacts
          path: legal/generated
